/* ================================================================ *
 *  DATA LAYER — Stooq free EOD history (no key), CORS-proxied.
 *  Cached per calendar day in localStorage so the app loads
 *  instantly after the first fetch of the day.
 * ================================================================ */
const PROXIES = [
  u => "https://api.allorigins.win/raw?url=" + encodeURIComponent(u),
  u => "https://corsproxy.io/?url=" + encodeURIComponent(u)
];
const STOOQ_HISTORY = t => "https://stooq.com/q/d/l/?s=" + t.toLowerCase() + ".us&i=d";
const CACHE_KEY = "fundledger.v2";
const todayKey = () => new Date().toISOString().slice(0,10);

function loadCache(){
  try {
    const raw = localStorage.getItem(CACHE_KEY);
    if(!raw) return null;
    const c = JSON.parse(raw);
    return c.day === todayKey() ? c : null;
  } catch { return null; }
}
function saveCache(data){
  try { localStorage.setItem(CACHE_KEY, JSON.stringify({ day: todayKey(), ...data })); } catch {}
}

/* ---- Tier 0: pre-built data.json committed by the scheduled job ----
 * Same-origin, so it loads instantly with no proxies and no waiting. */
async function loadStatic(){
  const res = await fetch("./data.json?v=" + todayKey(), { cache: "no-cache", signal: AbortSignal.timeout(6000) });
  if (!res.ok) throw new Error("no data.json");
  const j = await res.json();
  if (!j || !j.returns || Object.keys(j.returns).length < 10) throw new Error("bad data.json");
  return j;
}

async function fetchWithProxies(url){
  let lastErr;
  for (const wrap of PROXIES){
    try {
      const res = await fetch(wrap(url), { signal: AbortSignal.timeout(15000) });
      if(!res.ok) throw new Error("HTTP "+res.status);
      const text = await res.text();
      if (text && text.length > 40) return text;
      throw new Error("empty body");
    } catch(e){ lastErr = e; }
  }
  throw lastErr || new Error("all proxies failed");
}

/* ---- 100%+ Club: free full-market screen via stockanalysis.com ----
 * Free and keyless; covers all US-listed stocks (NYSE, Nasdaq, ADRs) with
 * end-of-day data. Endpoint is undocumented, so parsing is defensive and
 * the app falls back to the labeled snapshot if the shape ever changes. */
const CLUB_URL = "https://stockanalysis.com/_api/endpoints/screener/data-points?type=s&ids=chYTD+price";

function parseClub(jsonText){
  const j = JSON.parse(jsonText);
  const map = (j && j.data && j.data.data) || {};
  const out = Object.entries(map)
    .map(([t,v]) => ({ t:String(t).toUpperCase(), n:"", price:Number(v.price), ytd:Number(v.chYTD) }))
    .filter(r => isFinite(r.price) && isFinite(r.ytd) && r.price >= 1 && r.ytd > 100)
    .sort((a,b)=>b.ytd-a.ytd)
    .slice(0,50)
    .map(r => ({ ...r, ytd:+r.ytd.toFixed(2) }));
  return out;
}

async function fetchClub(){
  const text = await fetchWithProxies(CLUB_URL);
  const rows = parseClub(text);
  if (!rows.length) throw new Error("no qualifying rows");
  return rows;
}

/* ---- Fallback source: Anthropic API with web search ----
 * Used when direct feeds are unreachable (e.g. previewing inside Claude,
 * where outside requests are blocked). Returns real, current figures via
 * web search rather than a price feed — clearly labeled in the UI. */
async function askClaudeJSON(prompt){
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({
      model:"claude-sonnet-4-6",
      messages:[{ role:"user", content:prompt }],
      tools:[{ type:"web_search_20250305", name:"web_search" }]
    })
  });
  const data = await res.json();
  const text = (data.content||[]).map(b=>b.text||"").join("\n").replace(/```json|```/g,"").trim();
  const m = text.match(/[\[{][\s\S]*[\]}]/);
  return JSON.parse(m ? m[0] : text);
}

const PERIOD_WORDS = {"1D":"1-day","1M":"1-month","2M":"2-month","3M":"3-month","YTD":"year-to-date","1Y":"1-year"};

async function claudeFetchReturns(period){
  const parsed = await askClaudeJSON(
    "Use web search to find the "+PERIOD_WORDS[period]+" price return (percent) as of the latest market close for each of these US-listed ETFs: "
    + UNIQUE_TICKERS.join(", ")
    + '. Reply with ONLY a raw JSON object mapping ticker to number, e.g. {"EWJ":2.3,"XLK":-1.2}. No prose, no markdown fences. Omit a ticker only if nothing is found.'
  );
  const clean = {};
  if (parsed && typeof parsed === "object" && !Array.isArray(parsed)){
    for (const [k,v] of Object.entries(parsed)) if (typeof v === "number" && isFinite(v)) clean[k.toUpperCase()] = v;
  }
  if (!Object.keys(clean).length) throw new Error("empty");
  return clean;
}

async function claudeFetchClub(){
  const parsed = await askClaudeJSON(
    'Use web search to find stocks up more than 100% year-to-date as of the latest close, share price at least $1.00, covering the whole universe a US retail investor can buy (NYSE, Nasdaq, S&P 500, Russell small caps, US-listed ADRs — not just the S&P 500). Reply with ONLY a raw JSON array like [{"t":"TICKER","n":"Name","price":12.3,"ytd":152.3}], sorted by ytd descending, top 25-30 confirmed names. No prose, no fences.'
  );
  const rows = (Array.isArray(parsed)?parsed:[])
    .filter(r=>r && r.t && typeof r.price==="number" && r.price>=1 && r.ytd>100)
    .map(r=>({t:String(r.t).toUpperCase(),n:String(r.n||r.t),price:r.price,ytd:+Number(r.ytd).toFixed(2)}))
    .sort((a,b)=>b.ytd-a.ytd);
  if (!rows.length) throw new Error("empty");
  return rows;
}

// Parse Stooq daily CSV -> [{d:Date, c:close}], oldest → newest.
function parseHistory(csv){
  const lines = csv.trim().split("\n");
  const out = [];
  for (let i=1;i<lines.length;i++){
    const p = lines[i].split(",");
    const close = parseFloat(p[4]);
    if (p[0] && isFinite(close)) out.push({ d:p[0], c:close });
  }
  return out;
}

// Compute period returns from a daily close series.
function computeReturns(hist){
  if (!hist || hist.length < 2) return null;
  const last = hist[hist.length-1];
  const lastDate = new Date(last.d+"T00:00:00");
  const closeOnOrBefore = target => {
    for (let i=hist.length-1;i>=0;i--) if (new Date(hist[i].d+"T00:00:00") <= target) return hist[i].c;
    return hist[0].c;
  };
  const minus = (months)=>{ const d=new Date(lastDate); d.setMonth(d.getMonth()-months); return d; };
  const jan1 = new Date(lastDate.getFullYear(),0,1);
  const yearAgo = new Date(lastDate); yearAgo.setFullYear(yearAgo.getFullYear()-1);
  const pct = base => base>0 ? +(((last.c/base)-1)*100).toFixed(2) : null;
  return {
    asOf: last.d,
    price: last.c,
    "1M": pct(closeOnOrBefore(minus(1))),
    "2M": pct(closeOnOrBefore(minus(2))),
    "3M": pct(closeOnOrBefore(minus(3))),
    "YTD": pct(closeOnOrBefore(jan1)),
    "1Y": pct(closeOnOrBefore(yearAgo))
  };
}

// Fetch all tickers with limited concurrency; report progress.
async function fetchAllReturns(onProgress){
  const results = {};
  let done = 0, failed = 0;
  const queue = [...UNIQUE_TICKERS];
  const workers = Array.from({length:6}, async ()=>{
    while(queue.length){
      const t = queue.shift();
      try {
        const csv = await fetchWithProxies(STOOQ_HISTORY(t));
        const r = computeReturns(parseHistory(csv));
        if (r) results[t] = r; else failed++;
      } catch { failed++; }
      done++; onProgress(done, UNIQUE_TICKERS.length);
    }
  });
  await Promise.all(workers);
  return { results, failed };
}

/* ---- Search: any US-listed stock/ETF by ticker or company name ----
 * Resolves a name via stockanalysis.com's global search API, then pulls
 * the same return metrics used everywhere else from their screener. */
const SEARCH_QUERY_URL = q => "https://stockanalysis.com/api/search?q=" + encodeURIComponent(q);
const SEARCH_FIELDS = "chYTD+price+ch1w+ch1m+ch3m+ch6m+ch1y+change+name";
// The screener's "type" param splits stocks (s) from ETFs (e) into separate
// universes — a ticker like SMH or QQQ is absent from type=s entirely, so
// both are fetched and merged into one combined lookup map.
const SEARCH_DATA_URLS = [
  "https://stockanalysis.com/_api/endpoints/screener/data-points?type=s&ids=" + SEARCH_FIELDS,
  "https://stockanalysis.com/_api/endpoints/screener/data-points?type=e&ids=" + SEARCH_FIELDS,

function findListings(t){

let _screenerMapCache = null;
async function fetchScreenerMap(){
  if (_screenerMapCache) return _screenerMapCache;
  // stockanalysis.com allows cross-origin requests directly; going through
  // the CORS proxies here would fail (their size limits reject this ~1-2MB
  // full-market payload), so these bypass fetchWithProxies on purpose.
  const maps = await Promise.all(SEARCH_DATA_URLS.map(async url => {
    const res = await fetch(url, { signal: AbortSignal.timeout(15000) });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const j = await res.json();
    return (j && j.data && j.data.data) || {};
  }));
  const merged = Object.assign({}, ...maps); // stocks + ETFs combined
  _screenerMapCache = merged;
  return merged;
}

// A few well-known colloquial names don't literally appear in the
// official listed name (e.g. "Google" trades as "Alphabet Inc.", so a
// literal text search for "google" misses it entirely and instead
// surfaces unrelated funds that merely mention the word "Google").
const SEARCH_ALIASES = { google: "alphabet", facebook: "meta platforms", fb: "meta platforms" };
// Major index benchmarks for the Search chart, via their tracking ETFs
// (this API doesn't serve raw index tickers like ^GSPC for free, but
// these ETFs track their indices closely enough for a visual comparison).
// Colors deliberately avoid red/rust tones so nothing is confusable with
// the searched ticker's red line below.
const BENCHMARKS = [
  { key: "SPY", label: "S&P 500", color: "#2E5C56" },
  { key: "QQQ", label: "Nasdaq", color: "#A8823C" },
  { key: "IWM", label: "Russell 2000", color: "#2563EB" },
  { key: "DIA", label: "DJIA", color: "#5B6259" },
];
const CHART_TICKER_COLOR = "#DC2626";

// Last ~3 months of daily closes for one ticker, via stockanalysis.com's
// own chart API (same direct-CORS origin already used elsewhere in the
// app for search/screener data — no CORS proxy needed, unlike the
// Stooq-based path used for the rest of the app's return calculations,
// which is more failure-prone since it depends on third-party proxies).
async function fetchHistory3M(t){
  const url = "https://stockanalysis.com/api/symbol/s/" + encodeURIComponent(t) + "/history?range=3M&period=Daily";
  const res = await fetch(url, { signal: AbortSignal.timeout(15000) });
  if (!res.ok) throw new Error("HTTP " + res.status);
  const j = await res.json();
  const data = j?.data;
  if (!Array.isArray(data) || !data.length) return null;
  // The API returns newest-first; reverse to oldest-first to match the
  // {d, c} convention the rest of the chart code expects.
  return data.map(p => ({ d: p.t, c: p.c })).reverse();
}

// Benchmark histories rarely change within a session, so fetch once and reuse.
let _benchmarkCache = null;
async function fetchBenchmarkHistories(){
  if (_benchmarkCache) return _benchmarkCache;
  const results = await Promise.all(BENCHMARKS.map(b => fetchHistory3M(b.key).catch(() => null)));
  _benchmarkCache = BENCHMARKS.map((b, i) => ({ ...b, hist: results[i] }));
  return _benchmarkCache;
}

// Build normalized (% change from window start) series for the searched
// ticker plus every available benchmark, trimmed to the same trading-day
// window so all lines start together and compare fairly.
function buildChartData(ticker, tickerHist, benchmarks){
  const validBenchmarks = benchmarks.filter(b => b.hist && b.hist.length > 1);
  if (!validBenchmarks.length || !tickerHist || tickerHist.length < 2) return null;

  // The benchmark window is derived ONLY from the benchmarks themselves,
  // never from the searched ticker’s history length. Benchmark data is
  // cached and identical every search, so this window — and therefore
  // every benchmark line’s shape and % values — stays fixed regardless
  // of which ticker was searched (previously it was re-trimmed and
  // re-normalized to match whichever ticker had the shortest history,
  // which is why the benchmark lines appeared to change between searches).
  const benchLen = Math.min(...validBenchmarks.map(b => b.hist.length));
  const toPts = hist => {
    const base = hist[0].c;
    return hist.map(p => ({ d: p.d, pct: ((p.c / base) - 1) * 100 }));
  };
  const benchTrimmed = validBenchmarks.map(b => b.hist.slice(-benchLen));
  const axisDates = benchTrimmed[0].map(p => p.d); // shared date axis, oldest to newest
  const benchSeries = validBenchmarks.map((b, i) => ({ label: b.label, color: b.color, pts: toPts(benchTrimmed[i]) }));

  // The ticker uses its own available window (which may be shorter than
  // the benchmarks’, e.g. a recent IPO) and is normalized from its own
  // start — it is never forced to match the benchmark window’s length.
  const tickerHistTrimmed = tickerHist.length > benchLen ? tickerHist.slice(-benchLen) : tickerHist;
  const tickerSeries = { label: ticker, color: CHART_TICKER_COLOR, pts: toPts(tickerHistTrimmed) };

  return { series: [tickerSeries, ...benchSeries], axisDates, asOf: axisDates[axisDates.length - 1] };
}

async function resolveTickers(query){
  const qRaw = query.trim();
  if (!qRaw) throw new Error("empty");
  const guess = qRaw.toUpperCase().replace(/[^A-Z.]/g, "");
  // If the input already looks like a bare ticker, try it directly first.
  // The screener's own "name" field is the company name for this case.
  if (guess && guess.length <= 5 && /^[A-Z.]+$/.test(guess)){
    const map = await fetchScreenerMap();
    if (map[guess]) return [{ t: guess, n: map[guess].name || guess, v: map[guess] }];
  }
  // Otherwise resolve a company name via the search API (also fetched
  // directly for the same reason as fetchScreenerMap above).
  const q = SEARCH_ALIASES[qRaw.toLowerCase()] || qRaw;
  const searchRes = await fetch(SEARCH_QUERY_URL(q), { signal: AbortSignal.timeout(15000) });
  if (!searchRes.ok) throw new Error("HTTP " + searchRes.status);
  const searchText = await searchRes.text();
  const sj = JSON.parse(searchText);
  const candidates = Array.isArray(sj) ? sj : (sj.data || sj.results || sj.stocks || sj.symbols || []);
  // Keep only primary US listings (type "s" stock or "e" ETF, plain symbol
  // with no dots/slashes) — this drops foreign cross-listings like
  // "bcba/NOWD" and dotted variants like "GOOG.M".
  const primary = candidates.filter(c => c && c.s && (c.t === "s" || c.t === "e") && /^[A-Z]+$/.test(c.s));
  if (!primary.length) throw new Error("not found");
  const anchor = primary[0];
  // For a stock match, also pull any other share class listed under the
  // exact same company name (e.g. GOOGL + GOOG both list as "Alphabet
  // Inc.") — but not unrelated ETFs that merely mention the company.
  const matches = anchor.t === "s"
    ? primary.filter(c => c.t === "s" && c.n === anchor.n)
    : [anchor];
  const map = await fetchScreenerMap();
  const results = [];
  const seen = new Set();
  for (const c of matches){
    const sym = c.s.toUpperCase();
    if (seen.has(sym) || !map[sym]) continue;
    seen.add(sym);
    const name = map[sym].name || c.name || c.n || sym;
    results.push({ t: sym, n: name, v: map[sym] });
    if (results.length >= 5) break; // sane cap
  }
  if (!results.length) throw new Error("no data");
  return results;
}

async function performSearch(){
  const input = $("#searchInput");
  const q = input ? input.value : state.search.query;
  if (!q || !q.trim()) return;
  state.search.query = q;
  state.search.loading = true; state.search.error = null; state.search.result = null;
  state.search.chart = null; state.search.chartLoading = false;
  render();
  let primaryTicker = null;
  try {
    const list = await resolveTickers(q);
    const num = x => { const nn = Number(x); return Number.isFinite(nn) ? nn : null; };
    state.search.result = list.map(({ t, n, v }) => {
      // Prefer the app's own Yahoo-sourced batch data when this ticker is
      // already part of the tracked list (e.g. SCHB, also shown under
      // Foundation ETFs / Base ETFs) — otherwise Search would show a
      // second, slightly different number from a different data provider
      // for the exact same ticker. Falls back to the live lookup for any
      // ticker outside that fixed list, which is most of what Search is for.
      const batch = state.returns[t];
      if (batch){
        return {
          t, n, price: batch.price ?? null,
          day: batch["1D"] ?? null, w: batch["5D"] ?? null, m1: batch["1M"] ?? null,
          m3: batch["3M"] ?? null, m2: batch["2M"] ?? null, m6: batch["6M"] ?? null, ytd: batch["YTD"] ?? null, y1: batch["1Y"] ?? null,
          inLists: findListings(t)
        };
      }
      return {
        t, n, price: num(v.price),
        day: num(v.change), w: num(v.ch1w), m1: num(v.ch1m), m3: num(v.ch3m),
        m2: null, // live lookup source doesn't serve a 2-month field; batch-tracked tickers above do
        m6: num(v.ch6m), ytd: num(v.chYTD), y1: num(v.ch1y),
        inLists: findListings(t)
      };
    });
    primaryTicker = list[0] && list[0].t;
  } catch (e) {
    state.search.error = "Couldn't find that ticker or company. Try the exact ticker symbol.";
  }
  state.search.loading = false;
  render();

  // Chart: fetched separately so the results table isn't held up waiting
  // on 3 months of daily history for 5 different symbols.
  if (primaryTicker){
    state.search.chartLoading = true;
    render();
    try {
      const [tickerHist, benchmarks] = await Promise.all([
        fetchHistory3M(primaryTicker),
        fetchBenchmarkHistories(),
      ]);
      if (tickerHist && tickerHist.length > 1){
        state.search.chart = buildChartData(primaryTicker, tickerHist, benchmarks);
      }
    } catch (e) {}
    state.search.chartLoading = false;
    render();
  }
}
const MONTH_ABBR = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
// "YYYY-MM-DD" -> "Mon DD, YY" (e.g. "2026-08-05" -> "Aug 05, 26"). A 3-letter
// month avoids the DD/MM vs MM/DD ambiguity of an all-numeric date — e.g.
// "05/08/26" could be misread as either May 8th or August 5th.
function fmtDate(d){
  if (!d) return null;
  const m = String(d).match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (!m) return null;
  const mon = MONTH_ABBR[parseInt(m[2],10)-1];
  if (!mon) return null;
  return mon + " " + m[3] + ", " + m[1].slice(2);
}
// Same "Mon DD, YY" format, from a JS Date object rather than a "YYYY-MM-DD"
// string — used for state.fetchedAt, which is stored as a Date.
function fmtDateObj(dt){
  if (!dt) return null;
  return MONTH_ABBR[dt.getMonth()] + " " + String(dt.getDate()).padStart(2,"0") + ", " + String(dt.getFullYear()).slice(-2);
}
// Uniform freshness label for every batch-refreshed section: "UPDATED EVERY 30 MIN AS OF Mon DD, YY"
function freshnessLabel(){
  return "UPDATED EVERY 30 MIN AS OF " + (fmtDate(state.dataAsOf) || "\u2014");
}

// Highlights the ticker symbol itself as a quick "what\u2019s this doing?"
// signal, distinct from the per-column coloring which only reflects each
// period in isolation:
//  - green: 5D, 1M, and 2M all positive \u2014 sustained uptrend
//  - red: 5D, 1M, and 2M all negative \u2014 sustained downtrend
//  - yellow: 5D and 1M negative but 2M positive \u2014 recent reversal
//    downward, turning negative after a positive 2-month run
//  - light blue: 5D and 1M positive but 2M negative \u2014 recent reversal
//    upward, turning positive after a negative 2-month run
function tickerClass(w, m1, m2){
  if (w == null || m1 == null || m2 == null) return '';
  if (w > 0 && m1 > 0 && m2 > 0) return ' class="tick-pos"';
  if (w < 0 && m1 < 0 && m2 < 0) return ' class="tick-neg"';
  if (w < 0 && m1 < 0 && m2 > 0) return ' class="tick-warn"';
  if (w > 0 && m1 > 0 && m2 < 0) return ' class="tick-trend"';
  return '';
}

// Lightweight custom SVG line chart \u2014 normalized (% change from the
// start of the window) so a stock's price and an index's price level are
// directly comparable on the same axis. No charting library needed.
function renderChartSVG(chart){
  if (!chart) return "";
  const { series, axisDates, asOf } = chart;
  // Points are positioned by their actual trading date against the shared
  // axis (built from the benchmarks’ own window), not by array index —
  // this lets the ticker’s line have fewer points than the benchmarks
  // (e.g. a recent IPO) and still land correctly, right-aligned on "today",
  // without needing to shrink or shift the benchmark lines to match.
  const dateIndex = new Map(axisDates.map((d, i) => [d, i]));
  const n = axisDates.length;
  const allPts = series.flatMap(s => s.pts.map(p => p.pct));
  const minY = Math.min(...allPts, 0), maxY = Math.max(...allPts, 0);
  const padY = (maxY - minY) * 0.12 || 1;
  const yLo = minY - padY, yHi = maxY + padY;
  const W = 640, H = 220, padL = 40, padR = 8, padT = 12, padB = 10;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  const xFor = i => padL + (n === 1 ? 0 : (i / (n - 1))) * plotW;
  const yFor = v => padT + (1 - (v - yLo) / (yHi - yLo)) * plotH;
  const zeroY = yFor(0);
  const pathFor = s => {
    let d = "", started = false;
    for (const p of s.pts){
      const idx = dateIndex.has(p.d) ? dateIndex.get(p.d) : null;
      if (idx == null) continue; // date not on the shared axis (rare) — skip rather than misplace
      d += (started ? "L" : "M") + xFor(idx).toFixed(1) + "," + yFor(p.pct).toFixed(1) + " ";
      started = true;
    }
    return d.trim();
  };
  const lines = series.map((s, i) =>
    '<path d="' + pathFor(s) + '" fill="none" stroke="' + s.color + '" stroke-width="' + (i === 0 ? 2.5 : 1.5) + '" />'
  ).join("");
  const yLabel = v => '<text x="4" y="' + (yFor(v) + 3).toFixed(1) + '" font-size="9" fill="var(--ink-faint)" font-family="var(--mono)">' + (v >= 0 ? "+" : "") + v.toFixed(0) + "%</text>";
  const legend = series.map(s => {
    const lastPct = s.pts.length ? s.pts[s.pts.length - 1].pct : null;
    return '<span style="display:inline-flex;align-items:center;gap:4px;margin-right:12px;margin-bottom:4px;">'
    + '<span style="width:9px;height:9px;border-radius:2px;background:' + s.color + ';display:inline-block;flex-shrink:0;"></span>'
    + esc(s.label) + (lastPct == null ? '' : ' <span style="color:' + (lastPct>=0?"var(--teal)":"var(--rust)") + ';font-weight:600;">'
    + (lastPct>=0?"+":"") + lastPct.toFixed(1) + '%</span>') + '</span>';
  }).join("");
  return '<div class="group-label">3-MONTH PERFORMANCE VS. BENCHMARKS' + (asOf ? ' \u00b7 THROUGH ' + esc(fmtDate(asOf) || asOf) : '') + '</div>'
    + '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;height:auto;display:block;background:var(--paper);border:1px solid var(--line);border-radius:8px;">'
    + '<line x1="' + padL + '" y1="' + zeroY.toFixed(1) + '" x2="' + (W - padR) + '" y2="' + zeroY.toFixed(1) + '" stroke="var(--line)" stroke-dasharray="3,3" />'
    + yLabel(yHi) + yLabel(0) + yLabel(yLo)
    + lines
    + '</svg>'
    + '<div style="display:flex;flex-wrap:wrap;padding-top:8px;font-family:var(--mono);font-size:10.5px;color:var(--ink-faint);">' + legend + '</div>';
}

// Sort a table's rows by any field, nulls always last, numbers or strings.
function sortRows(rows, key, dir){
  return [...rows].sort((a,b) => {
    const av = a[key], bv = b[key];
    if (av == null && bv == null) return 0;
    if (av == null) return 1;
    if (bv == null) return -1;
    if (typeof av === "string") return dir === "asc" ? av.localeCompare(bv) : bv.localeCompare(av);
    return dir === "asc" ? av - bv : bv - av;
  });
}
// Clickable <th> for a sortable column. Every sortable column shows a
// neutral \u2195 hint; the active column is highlighted green with a
// directional \u25b2/\u25bc arrow showing its current sort direction.
function sortableTh(section, key, label){
  const s = state.sort[section];
  const active = s && s.key === key;
  const arrow = active ? (s.dir === "asc" ? " \u25b2" : " \u25bc") : " \u2195";
  const style = active
    ? "cursor:pointer;user-select:none;color:var(--teal);background:rgba(46,92,86,0.14);font-weight:700;"
    : "cursor:pointer;user-select:none;";
  // Uses "data-tbl" (not "data-section") to avoid colliding with the
  // section-head expand/collapse buttons, which use "data-section" and
  // are checked first in the click handler below.
  return '<th data-action="sortCol" data-tbl="'+section+'" data-key="'+key+'" style="'+style+'">'+label+arrow+'</th>';
}

    + sectionHTML("green","06","All Green All Year", 0, greenBody)
    + sectionHTML("red","07","Shorts - All Red All Year", 0, redBody)
    + sectionHTML("month1","08","1 Month Gainers", 0, month1Body)
    + sectionHTML("multi","09","Tickers Listed Above Multiple Times", 0, multiBody)
    + sectionHTML("search","10","Search", 0, searchBody)
    + '<div class="spacer"></div>';
}

/* ================================================================ *
 *  EVENTS (delegated)
 * ================================================================ */
document.addEventListener("click", e => {
  const el = e.target.closest("[data-section],[data-action]");
  if (!el) return;

  if (el.dataset.section){
    state.expanded[el.dataset.section] = !state.expanded[el.dataset.section];
    render(); return;
  }
  const a = el.dataset.action;
  if (a === "doSearch"){
    performSearch();
    return;
  } else if (a === "timeframe"){
    state.timeframe = state.timeframe === el.dataset.v ? null : el.dataset.v;
    ensurePeriod();
  } else if (a === "originFilter"){
    state.originFilter = state.originFilter === el.dataset.v ? null : el.dataset.v;
  } else if (a === "sortCol"){
    const section = el.dataset.tbl, key = el.dataset.key;
    const cur = state.sort[section];
    if (cur && cur.key === key) cur.dir = cur.dir === "asc" ? "desc" : "asc";
    else state.sort[section] = { key, dir: "desc" };
  } else if (a === "family"){
    state.family = state.family === el.dataset.v ? null : el.dataset.v;
    state.selected.foundation = new Set();
  } else if (a === "chip"){
    const g = el.dataset.g;
    if (g === "timeframe") state.timeframe = null;
    else { state.selected[g].delete(el.dataset.t); }
  } else if (state.selected[a]){
    const set = state.selected[a];
    set.has(el.dataset.t) ? set.delete(el.dataset.t) : set.add(el.dataset.t);
  }
  render();
});

$("#refreshBtn").addEventListener("click", () => loadData(true));

// Keep the search box's typed value in state (without a full re-render per
// keystroke) so it survives re-renders triggered by unrelated actions.
document.addEventListener("input", e => {
  if (e.target && e.target.id === "searchInput") state.search.query = e.target.value;
});
document.addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target && e.target.id === "searchInput"){
    e.preventDefault();
    performSearch();
  }
});

/* ================================================================ *
 *  BOOT
 * ================================================================ */
async function ensurePeriod(){
  // Stooq history already contains every period; only the search source
  // fetches per-period, so pull any missing one on demand.
  if (state.source !== "search") return;
  const p = activePeriod();
  if (state.searchReturns[p]) return;
  state.loading = true; render();
  try {
    state.searchReturns[p] = await claudeFetchReturns(p);
    state.fetchedAt = new Date();
  } catch {}
  state.loading = false; render();
}

async function loadData(force){
  /* Tier 0: pre-built market-close file — instant, no waiting. */
  if (!force){
    try {
      const j = await loadStatic();
      Object.assign(state, {
        returns: j.returns, dataAsOf: j.dataAsOf, partial: j.partial || 0,
        source: "static",
        fetchedAt: j.generatedAt ? new Date(j.generatedAt) : null,
        club: j.club || null,
        starGainers: j.starGainers || null,
        allGreen: j.allGreen || null,
        allRed: j.allRed || null,
        oneMonthGainers: j.oneMonthGainers || null,
        multiListed: j.multiListed || null,
        etf1YClub: j.etf1YClub || null,
        clubSource: j.club ? (j.clubSource || "screen") : null,
        clubFetchedAt: j.generatedAt ? new Date(j.generatedAt) : null,
        loading: false
      });
      render();
      return;
    } catch {}
  }

  /* Tier 1: today's on-device cache. */
  const cached = force ? null : loadCache();
  if (cached && cached.source){
    Object.assign(state, {
      returns: cached.returns || {}, searchReturns: cached.searchReturns || {},
      dataAsOf: cached.dataAsOf, source: cached.source,
      fetchedAt: cached.fetchedAt ? new Date(cached.fetchedAt) : null,
      partial: cached.partial || 0,
      club: cached.club || null, clubSource: cached.clubSource || null,
      clubFetchedAt: cached.clubFetchedAt ? new Date(cached.clubFetchedAt) : null,
      loading: false
    });
    render();
    return;
  }
  state.loading = true; state.loadProgress = "";
  render();

  /* --- Primary: direct EOD feeds (probe once so blocked environments
         fail over to search in seconds instead of minutes) --- */
  let stooqOk = false;
  let probeOk = false;
  try {
    const probe = await fetchWithProxies(STOOQ_HISTORY("SPY"));
    probeOk = parseHistory(probe).length > 0;
  } catch {}
  if (probeOk) try {
    const { results, failed } = await fetchAllReturns((d,total)=>{
      state.loadProgress = d + " / " + total + " tickers";
      $("#freshness").textContent = "Fetching latest prices… " + state.loadProgress;
    });
    if (Object.keys(results).length >= 10){
      state.returns = results;
      state.partial = failed;
      const dates = Object.values(results).map(r=>r.asOf).sort();
      state.dataAsOf = dates[dates.length-1] || null;
      state.source = "stooq";
      stooqOk = true;
    }
  } catch {}

  if (probeOk) try {
    const rows = await fetchClub();
    state.club = rows; state.clubSource = "screen"; state.clubFetchedAt = new Date();
  } catch { state.club = null; state.clubSource = null; }

  /* --- Fallback: web search via the Anthropic API (works in preview) --- */
  if (!stooqOk){
    $("#freshness").textContent = "Direct feed blocked — fetching latest close via web search…";
    try {
      state.searchReturns[activePeriod()] = await claudeFetchReturns(activePeriod());
      state.source = "search";
    } catch { state.source = null; }
  }
  if (!state.club){
    try {
      state.club = await claudeFetchClub();
      state.clubSource = "search"; state.clubFetchedAt = new Date();
    } catch {}
  }

  if (state.source || state.club) state.fetchedAt = new Date();
  saveCache({
    source: state.source, returns: state.returns, searchReturns: state.searchReturns,
    dataAsOf: state.dataAsOf,
    fetchedAt: state.fetchedAt ? state.fetchedAt.toISOString() : null,
    partial: state.partial,
    club: state.club, clubSource: state.clubSource,
    clubFetchedAt: state.clubFetchedAt ? state.clubFetchedAt.toISOString() : null
  });
  state.loading = false;
  state.loadProgress = "";
  render();
}

render();
loadData(false);
</script>
